# Render Blueprint: Render 대시보드에서 "New +" > "Blueprint"로 이 저장소를 선택하면
# 아래 설정대로 백엔드 서비스가 자동 구성된다. 실제 비밀 값(sync: false 항목)은
# Render가 배포 전에 입력하라고 물어보며, 값 자체는 이 파일에 절대 적지 않는다.
services:
  - type: web
    name: steady-listening-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: OPENAI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: APP_SHARED_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
